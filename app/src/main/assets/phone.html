<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#05070d">
<title>NEXUS · Ride Along</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: -apple-system, Roboto, "Segoe UI", sans-serif; background: radial-gradient(circle at 50% -20%, #1b2a55, #05070d 60%) fixed; color: #e8f1ff; min-height: 100vh; }
  .wrap { max-width: 520px; margin: 0 auto; padding: 22px 18px 60px; }
  h1 { font-size: 30px; letter-spacing: 10px; text-align: center; margin: 12px 0 2px; background: linear-gradient(90deg, #3dd6ff, #b46bff); -webkit-background-clip: text; color: transparent; }
  .sub { text-align: center; color: #8ea3c7; font-size: 13px; letter-spacing: 2px; margin-bottom: 22px; }
  .card { background: rgba(255,255,255,.05); border: 1px solid rgba(120,180,255,.18); border-radius: 18px; padding: 16px; margin: 14px 0; }
  .card h2 { margin: 0 0 10px; font-size: 15px; letter-spacing: 3px; color: #9fd0ff; }
  input, textarea { width: 100%; font-size: 17px; padding: 14px; border-radius: 12px; border: 1px solid rgba(150,200,255,.25); background: rgba(0,0,0,.35); color: #fff; outline: none; }
  textarea { resize: none; height: 70px; }
  button { width: 100%; margin-top: 10px; padding: 15px; font-size: 16px; font-weight: 700; letter-spacing: 2px; border: 0; border-radius: 12px; color: #04121f;
    background: linear-gradient(90deg, #3dd6ff, #7d8cff); }
  button:active { transform: scale(.98); opacity: .85; }
  button.alt { background: rgba(255,255,255,.08); color: #e8f1ff; border: 1px solid rgba(150,200,255,.25); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .grid button { margin: 0; padding: 16px 4px; font-size: 13px; }
  .q { padding: 9px 4px; border-bottom: 1px solid rgba(255,255,255,.07); font-size: 15px; }
  .q small { color: #8ea3c7; }
  .now { color: #3dff9a; font-size: 14px; margin-bottom: 6px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #3dff9a; color: #032; padding: 12px 18px; border-radius: 30px; font-weight: 700; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .hidden { display: none; }
  .who { text-align: center; color: #8ea3c7; font-size: 13px; }
  #preview { max-width: 100%; border-radius: 12px; margin-top: 10px; display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>NEXUS</h1>
  <div class="sub">RIDE ALONG</div>

  <div id="join" class="card">
    <h2>JOIN THE RIDE</h2>
    <input id="name" placeholder="Your name" maxlength="24" autocomplete="given-name">
    <input id="pin" placeholder="4-digit code on the truck screen" inputmode="numeric" maxlength="4" style="margin-top:10px">
    <button id="joinBtn">JOIN</button>
  </div>

  <div id="main" class="hidden">
    <div class="who" id="who"></div>

    <div class="card">
      <h2>🎵 REQUEST A SONG</h2>
      <div class="now" id="now"></div>
      <input id="song" placeholder="Song and artist">
      <button id="songBtn">ADD TO THE QUEUE</button>
      <div id="queue" style="margin-top:10px"></div>
    </div>

    <div class="card">
      <h2>📸 SEND A PHOTO TO THE SCREEN</h2>
      <input id="file" type="file" accept="image/*" class="hidden">
      <button id="pickBtn" class="alt">CHOOSE OR TAKE A PHOTO</button>
      <img id="preview" alt="">
      <button id="photoBtn" class="hidden">SEND IT</button>
    </div>

    <div class="card">
      <h2>💬 SHOUT-OUT</h2>
      <textarea id="msg" placeholder="Nexus reads it out loud and puts it on the screen"></textarea>
      <button id="msgBtn">SEND SHOUT-OUT</button>
    </div>

    <div class="card">
      <h2>🎛 REMOTE</h2>
      <div class="grid">
        <button data-cmd="prev">⏮ BACK</button><button data-cmd="play">⏯ PLAY</button><button data-cmd="next">⏭ NEXT</button>
        <button data-cmd="voldown">🔉 VOL −</button><button data-cmd="party">🎉 PARTY</button><button data-cmd="volup">🔊 VOL +</button>
        <button data-cmd="hype">🎤 HYPE</button><button data-cmd="airhorn">📯 HORN</button><button data-cmd="lasers">🔦 LASERS</button>
      </div>
    </div>
    <button class="alt" id="leave">CHANGE NAME</button>
  </div>
</div>
<div id="toast"></div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var me = { name: localStorage.getItem('nx_name') || '', pin: localStorage.getItem('nx_pin') || '' };
  var urlPin = (location.search.match(/[?&]p=(\d{4})/) || [])[1];
  if (urlPin) { me.pin = urlPin; $('pin').value = urlPin; $('pin').style.display = 'none'; }
  $('name').value = me.name;
  function toast(t) { var e = $('toast'); e.textContent = t; e.style.opacity = 1; clearTimeout(e.t); e.t = setTimeout(function () { e.style.opacity = 0; }, 2200); }
  function post(path, data) {
    data.pin = me.pin; data.name = me.name;
    return fetch('/api/' + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
      .then(function (r) { return r.json(); })
      .then(function (j) { if (!j.ok && j.error === 'pin') { toast('Wrong code — check the truck screen'); showJoin(); } return j; })
      .catch(function () { toast('Can\'t reach the truck — same Wi-Fi?'); return { ok: false }; });
  }
  function showJoin() { $('join').classList.remove('hidden'); $('main').classList.add('hidden'); }
  function showMain() { $('join').classList.add('hidden'); $('main').classList.remove('hidden'); $('who').textContent = 'Riding as ' + me.name; refresh(); }
  $('joinBtn').onclick = function () {
    me.name = $('name').value.trim(); me.pin = urlPin || $('pin').value.trim();
    if (!me.name) return toast('Type your name');
    if (!/^\d{4}$/.test(me.pin)) return toast('Type the 4-digit code');
    post('join', {}).then(function (j) { if (j.ok) { localStorage.setItem('nx_name', me.name); localStorage.setItem('nx_pin', me.pin); toast('You\'re in!'); showMain(); } });
  };
  $('leave').onclick = function () { showJoin(); };
  $('songBtn').onclick = function () { var t = $('song').value.trim(); if (!t) return toast('Type a song'); post('song', { text: t }).then(function (j) { if (j.ok) { $('song').value = ''; toast('Added to the queue'); setTimeout(refresh, 600); } }); };
  $('msgBtn').onclick = function () { var t = $('msg').value.trim(); if (!t) return toast('Type a message'); post('msg', { text: t }).then(function (j) { if (j.ok) { $('msg').value = ''; toast('Shout-out sent'); } }); };
  Array.prototype.forEach.call(document.querySelectorAll('[data-cmd]'), function (b) { b.onclick = function () { post('remote', { cmd: b.getAttribute('data-cmd') }); }; });
  var photo = null;
  $('pickBtn').onclick = function () { $('file').click(); };
  $('file').onchange = function () {
    var f = $('file').files[0]; if (!f) return;
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () {
      var max = 1600, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      photo = c.toDataURL('image/jpeg', .85); URL.revokeObjectURL(url);
      $('preview').src = photo; $('preview').style.display = 'block'; $('photoBtn').classList.remove('hidden');
    };
    img.src = url;
  };
  $('photoBtn').onclick = function () { if (!photo) return; $('photoBtn').textContent = 'SENDING…'; post('photo', { data: photo }).then(function (j) { $('photoBtn').textContent = 'SEND IT'; if (j.ok) { toast('It\'s on the screen!'); photo = null; $('preview').style.display = 'none'; $('photoBtn').classList.add('hidden'); } }); };
  function esc(t) { return String(t).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function refresh() {
    fetch('/api/state').then(function (r) { return r.json(); }).then(function (s) {
      $('now').textContent = s.now ? '▶ NOW PLAYING · ' + s.now : '';
      var q = s.queue || [];
      $('queue').innerHTML = q.length ? q.map(function (x, i) { return '<div class="q">' + (i + 1) + '. ' + esc(x.text) + ' <small>· ' + esc(x.name) + '</small></div>'; }).join('') : '<div class="q"><small>The queue is empty. Add a song!</small></div>';
    }).catch(function () {});
  }
  setInterval(function () { if (!$('main').classList.contains('hidden')) refresh(); }, 5000);
  if (me.name && /^\d{4}$/.test(me.pin)) post('join', {}).then(function (j) { if (j.ok) showMain(); }); else showJoin();
})();
</script>
</body>
</html>
