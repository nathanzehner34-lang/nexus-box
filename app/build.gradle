plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.nexus.box'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nexus.box'
        minSdk 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk 29
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    def ks = System.getenv("NEXUS_KEYSTORE")
    if (ks != null && new File(ks).exists()) {
        signingConfigs {
            debug {
                storeFile file(ks)
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        // Isolated Nexus 23 test app: install and update it alongside Nexus 22
        // without replacing Nexus 22's app data or launcher installation.
        nexus23 {
            initWith debug
            applicationIdSuffix '.nexus23'
            versionNameSuffix '-nexus23'
        }

        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
}
