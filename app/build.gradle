plugins {
    id 'com.android.application'
}

def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1") as Integer

android {
    namespace 'com.nexus.box'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nexus.box'
        minSdk 24
        //noinspection ExpiredTargetSdkVersion
        targetSdk 29
        versionCode runNumber
        versionName "1.0." + runNumber
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
