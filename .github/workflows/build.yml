name: Build Nexus

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore the Nexus signing key
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: ~/nexus-signing/nexus.keystore
          key: nexus-signing-key-v2

      - name: Create the signing key (first build only)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/nexus-signing
          keytool -genkeypair -keystore ~/nexus-signing/nexus.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 20000 \
            -dname "CN=Nexus Box, O=Nexus, C=CA"

      - name: Save the signing key for future builds
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/nexus-signing/nexus.keystore
          key: nexus-signing-key-v2

      - name: Add AI key
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then
            printf 'window.NEXUS_DEFAULT_KEY = %s;\n' "$(printf '%s' "$GEMINI_KEY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')" > app/src/main/assets/key.js
          else
            echo '' > app/src/main/assets/key.js
          fi

      - name: Set up Node.js for source checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check source integration
        run: |
          node --check app/src/main/assets/app.js
          node --check app/src/main/assets/party.js
          node --check app/src/main/assets/experiences.js
          node --check app/src/main/assets/env.js
          node --check app/src/main/assets/visuals.js
          node tools/voice-test/production-visual-upgrade.test.js
          node tools/voice-test/visual-world-packs.test.js
          node tools/voice-test/nexus-visuals.test.js
          node tools/voice-test/liquid-dreams-reactivity.test.js
          SOAK_ROUNDS=4 node tools/voice-test/soak-switching.test.js
          node tools/voice-test/liquid-dreams-development.test.js
          node tools/voice-test/liquid-dreams-render.test.js
          node --check tools/voice-test/liquid-dreams-playall.test.js
          node --check tools/voice-test/liquid-dreams-music.test.js
          node tools/voice-test/party-mode-render.test.js
          node --check tools/voice-test/party-experiences-render.test.js
          node --check tools/voice-test/energy-flow-music.test.js
          node --check tools/voice-test/night-drive.test.js
          node --check tools/voice-test/ink-machine.test.js
          node tools/voice-test/live-environments.test.js
          node tools/voice-test/cleanup-performance.test.js

      - name: Build APK
        run: |
          export NEXUS_KEYSTORE="$HOME/nexus-signing/nexus.keystore"
          ls -l "$NEXUS_KEYSTORE"
          keytool -list -v -keystore "$NEXUS_KEYSTORE" -storepass android | grep -m1 SHA256
          # Boxes running build 45 or older reject update APKs under 1 MB. Until every box has
          # updated past that check, an incompressible filler asset keeps releases above the limit.
          head -c 760000 /dev/urandom > app/src/main/assets/update-compat.bin
          gradle assembleDebug --no-daemon --stacktrace
          SIZE=$(stat -c%s app/build/outputs/apk/debug/app-debug.apk)
          echo "APK size: $SIZE bytes"
          test "$SIZE" -gt 1150000

      - name: Verify production update compatibility
        env:
          EXPECTED_VERSION: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          TOOLS="$(find "$SDK/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          AAPT="$TOOLS/aapt"
          APKSIGNER="$TOOLS/apksigner"
          test -s "$APK"
          test -x "$AAPT"
          test -x "$APKSIGNER"
          PACKAGE="$("$AAPT" dump badging "$APK" | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          VERSION="$("$AAPT" dump badging "$APK" | sed -n "s/^package:.*versionCode='\\([^']*\\)'.*/\\1/p")"
          test "$PACKAGE" = "com.nexus.box"
          test "$VERSION" = "$EXPECTED_VERSION"
          "$APKSIGNER" verify --print-certs "$APK" > /tmp/nexus-new-certificate.txt
          NEW_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/nexus-new-certificate.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          KEY_CERT="$(keytool -list -v -keystore "$HOME/nexus-signing/nexus.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: *//p' | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$NEW_CERT"
          test "$NEW_CERT" = "$KEY_CERT"
          curl --fail --silent --show-error --location "https://github.com/nathanzehner34-lang/nexus-box/releases/download/latest/nexus.apk" -o /tmp/nexus-current.apk
          OLD_PACKAGE="$("$AAPT" dump badging /tmp/nexus-current.apk | sed -n "s/^package: name='\\([^']*\\)'.*/\\1/p")"
          test "$OLD_PACKAGE" = "$PACKAGE"
          "$APKSIGNER" verify --print-certs /tmp/nexus-current.apk > /tmp/nexus-old-certificate.txt
          OLD_CERT="$(sed -n 's/.*certificate SHA-256 digest: //p' /tmp/nexus-old-certificate.txt | head -n1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$OLD_CERT"
          test "$NEW_CERT" = "$OLD_CERT"
          echo "Verified package=$PACKAGE versionCode=$VERSION certificate=$NEW_CERT matches current truck APK and cached key."

      - name: Prepare download
        run: cp app/build/outputs/apk/debug/app-debug.apk nexus.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nexus.apk \
            --title "Nexus (build ${{ github.run_number }})" \
            --notes "Install on the truck box: open this page on the box and tap nexus.apk." \
            --latest
