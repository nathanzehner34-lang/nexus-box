name: Build Nexus

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Keep the same signing key between builds
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nexus-debug-keystore-v1

      - name: Add AI key
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then
            printf 'window.NEXUS_DEFAULT_KEY = %s;\n' "$(printf '%s' "$GEMINI_KEY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')" > app/src/main/assets/key.js
          else
            echo '' > app/src/main/assets/key.js
          fi

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare download
        run: cp app/build/outputs/apk/debug/app-debug.apk nexus.apk

      - name: Publish to "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest nexus.apk \
            --title "Nexus (build ${{ github.run_number }})" \
            --notes "Install on the truck box: open this page on the box and tap nexus.apk." \
            --latest
