name: Nexus 23 Development APK

on:
  workflow_dispatch:

permissions:
  contents: write   # only to publish the separate nexus-23-dev download (never the 'latest' Nexus 22 release)

concurrency:
  group: nexus23-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and upload APK
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/nexus-23'
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Reuse the signing key used by the existing Nexus build so test APKs
      # remain installable as updates to the same app on the test device.
      - name: Restore the Nexus signing key
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: ~/nexus-signing/nexus.keystore
          key: nexus-signing-key-v2

      - name: Create a signing key if none is cached
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$HOME/nexus-signing"
          keytool -genkeypair -keystore "$HOME/nexus-signing/nexus.keystore" -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 20000 \
            -dname "CN=Nexus Box, O=Nexus, C=CA"

      - name: Save a newly created signing key
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/nexus-signing/nexus.keystore
          key: nexus-signing-key-v2

      - name: Add the configured AI key
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then
            printf 'window.NEXUS_DEFAULT_KEY = %s;\n' "$(printf '%s' "$GEMINI_KEY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')" > app/src/main/assets/key.js
          else
            : > app/src/main/assets/key.js
          fi

      - name: Build debug APK
        run: |
          export NEXUS_KEYSTORE="$HOME/nexus-signing/nexus.keystore"
          gradle assembleNexus23 --no-daemon --stacktrace

      - name: Upload APK for testing
        uses: actions/upload-artifact@v4
        with:
          name: nexus-23-development-apk
          path: app/build/outputs/apk/nexus23/app-nexus23.apk
          if-no-files-found: error
          retention-days: 30

      # Easy link for the truck: no GitHub sign-in, no zip. Uses its own 'nexus-23-dev' tag as a pre-release,
      # so the Nexus 22 'latest' release and its UPDATE NEXUS button are never touched.
      - name: Publish Nexus 23 test download link
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/nexus23/app-nexus23.apk nexus23.apk
          gh release delete nexus-23-dev --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create nexus-23-dev nexus23.apk -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --latest=false --title "Nexus 23 test build" \
            --notes "Test build of Nexus 23 (installs next to Nexus 22). Built from ${GITHUB_SHA::7}."

      - name: Show download instructions
        run: |
          {
            echo '## Nexus 23 APK is ready'
            echo 'Download the **nexus-23-development-apk** artifact from the run summary. The artifact contains `app-nexus23.apk` and expires after 30 days.'
            echo 'Easy download (no sign-in): https://github.com/'"$GITHUB_REPOSITORY"'/releases/download/nexus-23-dev/nexus23.apk'
            echo 'This only replaces the nexus-23-dev pre-release. The Nexus 22 latest release is not touched.'
          } >> "$GITHUB_STEP_SUMMARY"
