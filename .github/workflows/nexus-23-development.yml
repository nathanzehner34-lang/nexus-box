name: Nexus 23 Development APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build downloadable development APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore Nexus signing key
        id: keycache
        uses: actions/cache/restore@v4
        with:
          path: ~/nexus-signing/nexus.keystore
          key: nexus-signing-key-v2

      - name: Create signing key if needed
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/nexus-signing
          keytool -genkeypair -keystore ~/nexus-signing/nexus.keystore -alias androiddebugkey \
            -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 20000 \
            -dname "CN=Nexus Box, O=Nexus, C=CA"

      - name: Save signing key for future builds
        if: steps.keycache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/nexus-signing/nexus.keystore
          key: nexus-signing-key-v2

      - name: Add AI key
        env:
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
        run: |
          if [ -n "$GEMINI_KEY" ]; then
            printf 'window.NEXUS_DEFAULT_KEY = %s;\n' "$(printf '%s' "$GEMINI_KEY" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read().strip()))')" > app/src/main/assets/key.js
          else
            echo '' > app/src/main/assets/key.js
          fi

      - name: Build APK
        run: |
          export NEXUS_KEYSTORE="$HOME/nexus-signing/nexus.keystore"
          gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk nexus-23-development.apk

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: nexus-23-development-apk
          path: nexus-23-development.apk
          if-no-files-found: error
          retention-days: 14
